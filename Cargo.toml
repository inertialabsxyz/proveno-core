[package]
name = "proveno"
version.workspace = true
edition.workspace = true

[workspace]
members = ["proveno-compiler"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Single source of truth for every version pin shared by more than one member,
# plus the crypto and openvm pins. When the workspace is split into separate
# repositories each one re-pins from here rather than from eight manifests.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false, features = ["oid"] }
sha3 = { version = "0.10", default-features = false }
# The only non-crates.io source in the workspace.

[features]
# `poseidon` stays in the default set deliberately: compiler::codegen selects
# the program-hash scheme on it, so removing it would silently switch every
# committed program_hash from Poseidon2 to SHA-256. `tls` is opt-in because it
# is one provenance provider, not part of the runtime.
default = ["std", "poseidon"]
std = ["dep:serde_json"]
# Declared explicitly rather than left implicit from `dep:serde`: five members
# request it by name, so it is part of the public feature surface.
serde = ["dep:serde"]

# BN254 Poseidon2 commitments, byte-identical to what the Noir circuit
# recomputes. Required by the Noir proving path (`proveno-noir`, `make test-prove`).
#
# Pulls in the noir-lang acir ecosystem and, through bn254_blackbox_solver,
# wasmer + cranelift. cranelift 0.91 pins target-lexicon 0.12, whose build
# script hard-panics on target triples it does not recognise, including the
# custom RISC-V triples zkVM toolchains use. Leave this off for zkVM guest
# builds and use the SHA-256 commitment scheme instead
# (`OracleTape::commitment_hash_sha256`, `compute_public_inputs_sha256`).
poseidon = ["dep:acir", "dep:bn254_blackbox_solver"]

[dependencies]
sha2.workspace = true
# Keccak-256 (Ethereum/Solidity flavour, not NIST SHA3) for the output_hash
# commitment the on-chain consumer checks via keccak256(outputPayload).
sha3.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# RSA signature verification for cert chains where intermediate/root CAs use RSA
# Poseidon2 hashing for Noir-circuit-friendly commitments (see `poseidon` feature).
acir = { version = "0.46", optional = true }
bn254_blackbox_solver = { version = "0.46", optional = true }

[dev-dependencies]
serde_json.workspace = true
